data: data/raw/cifar10/cifar-10-batches-py/test_batch
output: runs/visualizations/cifar10/cifar10_label_examples_two_rows.pdf
output_row: runs/visualizations/cifar10/cifar10_label_examples_single_row.pdf
labels: [airplane, automobile, bird, cat, deer, dog, frog, horse, ship, truck]
# Zero-based position within each class, not the absolute test index.
sample_index: 0
dpi: 180
figsize: [11, 5.6]
row_figsize: [20, 3.1]
font_size: 18
interpolation: nearest
show_title: false
show_labels: true
title_font_size: 20
title_y: 0.98
label_pad: 8.0
border_width: 2.2
border_color: '#3A3D42'
pad_inches: 0.12
transparent: true
